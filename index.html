<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marca d'agua</title>
<style>
  :root{
    --bg: #17111d; --bg-2: #221a2c; --paper: #fbf6ee;
    --amber: #f2b84b; --line: rgba(251,246,238,0.14); --erro: #e0654f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(circle at 50% 0%, var(--bg-2), var(--bg) 65%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--paper);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .card{
    width:100%; max-width: 520px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px;
  }
  h1{ font-size:18px; margin:0 0 4px; }
  .sub{ font-size:13px; color: rgba(251,246,238,0.55); margin:0 0 20px; }

  label{ display:block; font-size:12px; color: rgba(251,246,238,0.6); margin-bottom:6px; }
  #numeroLead{
    width:100%; padding:11px 12px; border-radius:8px;
    border:1px solid var(--line); background: rgba(0,0,0,0.25);
    color: var(--paper); font-size:14px; outline:none;
    margin-bottom:18px;
  }
  #numeroLead:focus{ border-color: var(--amber); }
  #numeroLead.erro{ border-color: var(--erro); }

  #drop{
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 34px 16px;
    text-align:center;
    font-size:14px;
    color: rgba(251,246,238,0.7);
    transition: all .15s ease;
    cursor:pointer;
  }
  #drop.ativo{ border-color: var(--amber); background: rgba(242,184,75,0.06); }
  #drop.bloqueado{ opacity:0.5; cursor:not-allowed; }

  button{
    padding:13px; background: var(--amber); color:#241a08; font-weight:600; font-size:14px;
    border:none; border-radius:999px; cursor:pointer;
  }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  #status{ margin-top:14px; font-size:13px; color: rgba(251,246,238,0.6); text-align:center; min-height:18px; }
  #status.erro{ color: var(--erro); }
  input[type=file]{ display:none; }

  #resultados{ margin-top:22px; display:flex; flex-direction:column; gap:14px; }
  .resultado{
    display:flex; gap:12px; align-items:center;
    border: 1px solid var(--line); border-radius:12px; padding:10px;
  }
  .resultado img{ width:64px; height:64px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .resultado .info{ flex:1; min-width:0; }
  .resultado .nome{ font-size:12px; color: rgba(251,246,238,0.7); word-break:break-all; margin-bottom:8px; }
  .resultado .acoes{ display:flex; gap:8px; }
  .resultado .acoes button{
    flex:1; padding:9px; font-size:12px;
    background: transparent; border:1px solid var(--amber); color: var(--amber);
  }
  .resultado .acoes button.copiado{ background: var(--amber); color:#241a08; }
  .rodape{ margin-top:18px; font-size:11px; color: rgba(251,246,238,0.35); text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Marca d'agua</h1>
    <p class="sub">Insira o numero do lead, depois arraste, cole (Ctrl+V) ou clique para adicionar a foto.</p>

    <label for="numeroLead">Numero do lead (WhatsApp)</label>
    <input type="text" id="numeroLead" placeholder="Ex: 5582991463995">

    <div id="drop" tabindex="0">Solte, cole ou clique aqui</div>
    <input type="file" id="arquivo" multiple accept="image/*">
    <div id="status"></div>
    <div id="resultados"></div>
    <p class="rodape">Tudo acontece no seu navegador. Nenhuma foto e enviada pra fora.</p>
  </div>

<script>
  // ======================= CONFIGURACOES =======================
  var COR_LINHA = '255,255,255';   // cor das linhas finas (R,G,B)
  var OPACIDADE_LINHA = 55;        // 0 (invisivel) a 255 (solido)
  var ESPESSURA_LINHA = 1;         // espessura de cada linha, em pixels
  var ESPACAMENTO_LINHA = 26;      // distancia entre uma linha e outra
  var ANGULO_LINHA = 45;           // inclinacao das linhas, em graus
  var LINHAS_CRUZADAS = true;      // true = grade (dois sentidos), false = so um sentido
  var SUFIXO_LINHAS = '-linhas';   // adicionado ao nome do arquivo com marca d'agua
  var QUALIDADE_JPG = 0.95;
  // ===============================================================

  var numeroInput = document.getElementById('numeroLead');
  var drop = document.getElementById('drop');
  var inputArquivo = document.getElementById('arquivo');
  var statusEl = document.getElementById('status');
  var resultadosEl = document.getElementById('resultados');
  var contadorPorNumero = {};

  function numeroAtual(){
    return numeroInput.value.trim();
  }

  function numeroSanitizado(){
    return numeroAtual().replace(/[^0-9a-zA-Z]/g, '');
  }

  function avisarNumeroFaltando(){
    statusEl.textContent = 'Adicione o numero do lead antes de colar/adicionar a foto.';
    statusEl.classList.add('erro');
    numeroInput.classList.add('erro');
    numeroInput.focus();
    setTimeout(function(){
      numeroInput.classList.remove('erro');
    }, 1600);
  }

  drop.addEventListener('click', function(){
    if (!numeroAtual()){ avisarNumeroFaltando(); return; }
    inputArquivo.click();
  });

  ['dragenter','dragover'].forEach(function(evento){
    drop.addEventListener(evento, function(e){
      e.preventDefault();
      if (numeroAtual()) drop.classList.add('ativo');
    });
  });
  ['dragleave','drop'].forEach(function(evento){
    drop.addEventListener(evento, function(e){
      e.preventDefault(); drop.classList.remove('ativo');
    });
  });
  drop.addEventListener('drop', function(e){
    if (!numeroAtual()){ avisarNumeroFaltando(); return; }
    receberArquivos(e.dataTransfer.files);
  });
  inputArquivo.addEventListener('change', function(e){
    receberArquivos(e.target.files);
    inputArquivo.value = '';
  });

  document.addEventListener('paste', function(e){
    var itens = (e.clipboardData || window.clipboardData).items;
    var imagens = [];
    for (var i = 0; i < itens.length; i++){
      if (itens[i].type.indexOf('image') !== -1){
        var arquivo = itens[i].getAsFile();
        if (arquivo) imagens.push(arquivo);
      }
    }
    if (imagens.length === 0) return;

    if (!numeroAtual()){
      e.preventDefault();
      avisarNumeroFaltando();
      return;
    }
    receberArquivos(imagens);
  });

  function receberArquivos(arquivos){
    var numero = numeroSanitizado();
    if (!numero){ avisarNumeroFaltando(); return; }
    var imagens = Array.from(arquivos).filter(function(a){
      return a.type.startsWith('image/');
    });
    imagens.forEach(function(arquivo){
      tratarNovaImagem(arquivo, numero);
    });
  }

  function extensaoDoArquivo(arquivo){
    if (arquivo.type === 'image/png') return 'png';
    if (arquivo.type === 'image/webp') return 'webp';
    if (arquivo.type === 'image/jpeg') return 'jpg';
    var nome = arquivo.name || '';
    var partes = nome.split('.');
    if (partes.length > 1) return partes.pop().toLowerCase();
    return 'jpg';
  }

  function proximoSufixoIndice(numero){
    contadorPorNumero[numero] = (contadorPorNumero[numero] || 0) + 1;
    var contador = contadorPorNumero[numero];
    return contador > 1 ? ('-' + contador) : '';
  }

  async function tratarNovaImagem(arquivo, numero){
    var sufixoIndice = proximoSufixoIndice(numero);

    // 1) baixa a foto original (sem marca), nomeada com o numero do lead
    var extensao = extensaoDoArquivo(arquivo);
    baixar(arquivo, numero + sufixoIndice + '.' + extensao);

    // 2) gera a versao com linhas automaticamente e deixa disponivel pra copiar/baixar
    statusEl.classList.remove('erro');
    statusEl.textContent = 'Gerando marca d\'agua...';
    try{
      var blobMarcado = await processarImagem(arquivo);
      var nomeMarcado = numero + sufixoIndice + SUFIXO_LINHAS + '.jpg';
      adicionarResultado(nomeMarcado, blobMarcado);
      statusEl.textContent = 'Pronto! Original baixado e versao com linhas disponivel abaixo.';
    } catch(erro){
      statusEl.textContent = 'Erro ao gerar marca d\'agua: ' + erro.message;
      statusEl.classList.add('erro');
    }
  }

  function desenharLinhas(ctx, w, h, anguloGraus){
    var diagonal = Math.sqrt(w*w + h*h) + 40;
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(anguloGraus * Math.PI / 180);
    ctx.beginPath();
    for (var y = -diagonal/2; y < diagonal/2; y += ESPACAMENTO_LINHA){
      ctx.moveTo(-diagonal/2, y);
      ctx.lineTo(diagonal/2, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function aplicarMarcaDagua(ctx, w, h){
    ctx.save();
    ctx.strokeStyle = 'rgba(' + COR_LINHA + ',' + (OPACIDADE_LINHA/255) + ')';
    ctx.lineWidth = ESPESSURA_LINHA;
    desenharLinhas(ctx, w, h, ANGULO_LINHA);
    if (LINHAS_CRUZADAS) desenharLinhas(ctx, w, h, ANGULO_LINHA + 90);
    ctx.restore();
  }

  function carregarImagem(arquivo){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(arquivo);
      img.onload = function(){ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function(erro){ URL.revokeObjectURL(url); reject(erro); };
      img.src = url;
    });
  }

  function processarImagem(arquivo){
    return carregarImagem(arquivo).then(function(img){
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      aplicarMarcaDagua(ctx, canvas.width, canvas.height);
      return new Promise(function(resolve){
        canvas.toBlob(function(blob){ resolve(blob); }, 'image/jpeg', QUALIDADE_JPG);
      });
    });
  }

  async function copiarParaClipboard(blob, botao){
    try{
      var bitmap = await createImageBitmap(blob);
      var canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      canvas.getContext('2d').drawImage(bitmap, 0, 0);
      var pngBlob = await new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
      await navigator.clipboard.write([ new ClipboardItem({ 'image/png': pngBlob }) ]);
      var textoOriginal = botao.textContent;
      botao.textContent = 'Copiado ✓';
      botao.classList.add('copiado');
      setTimeout(function(){
        botao.textContent = textoOriginal;
        botao.classList.remove('copiado');
      }, 1500);
    } catch(erro){
      alert('Nao foi possivel copiar: ' + erro.message);
    }
  }

  function baixar(blob, nome){
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = nome;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function adicionarResultado(nome, blob){
    var linha = document.createElement('div');
    linha.className = 'resultado';

    var img = document.createElement('img');
    img.src = URL.createObjectURL(blob);

    var info = document.createElement('div');
    info.className = 'info';

    var nomeEl = document.createElement('div');
    nomeEl.className = 'nome';
    nomeEl.textContent = nome;

    var acoes = document.createElement('div');
    acoes.className = 'acoes';

    var btnCopiar = document.createElement('button');
    btnCopiar.textContent = 'Copiar';
    btnCopiar.addEventListener('click', function(){ copiarParaClipboard(blob, btnCopiar); });

    var btnBaixar = document.createElement('button');
    btnBaixar.textContent = 'Baixar';
    btnBaixar.addEventListener('click', function(){ baixar(blob, nome); });

    acoes.appendChild(btnCopiar);
    acoes.appendChild(btnBaixar);
    info.appendChild(nomeEl);
    info.appendChild(acoes);
    linha.appendChild(img);
    linha.appendChild(info);
    resultadosEl.prepend(linha);
  }
</script>
</body>
</html>
