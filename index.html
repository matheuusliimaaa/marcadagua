<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marca d'água</title>
<style>
  :root{ --bg:#17111d; --bg-2:#221a2c; --paper:#fbf6ee; --amber:#f2b84b; --line:rgba(251,246,238,0.14); --erro:#e0654f; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%,var(--bg-2),var(--bg) 65%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--paper);
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:520px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:14px; padding:26px; }
  h1{ font-size:18px; margin:0 0 4px; }
  .sub{ font-size:13px; color:rgba(251,246,238,0.55); margin:0 0 20px; }
  label{ display:block; font-size:12px; color:rgba(251,246,238,0.6); margin-bottom:6px; }
  #numeroLead{ width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:rgba(0,0,0,0.25);
    color:var(--paper); font-size:14px; outline:none; margin-bottom:18px; }
  #numeroLead:focus{ border-color:var(--amber); }
  #numeroLead.erro{ border-color:var(--erro); }
  #drop{ border:1.5px dashed var(--line); border-radius:12px; padding:34px 16px; text-align:center; font-size:14px;
    color:rgba(251,246,238,0.7); transition:all .15s ease; cursor:pointer; }
  #drop.ativo{ border-color:var(--amber); background:rgba(242,184,75,0.06); }
  button{ padding:13px; background:var(--amber); color:#241a08; font-weight:600; font-size:14px; border:none; border-radius:999px; cursor:pointer; }
  #status{ margin-top:14px; font-size:13px; color:rgba(251,246,238,0.6); text-align:center; min-height:18px; }
  #status.erro{ color:var(--erro); }
  input[type=file]{ display:none; }
  #resultados{ margin-top:22px; display:flex; flex-direction:column; gap:14px; }
  .resultado{ display:flex; gap:12px; align-items:center; border:1px solid var(--line); border-radius:12px; padding:10px; }
  .resultado img,.resultado video{ width:64px; height:64px; object-fit:cover; border-radius:8px; flex-shrink:0; background:#000; }
  .resultado .info{ flex:1; min-width:0; }
  .resultado .nome{ font-size:12px; color:rgba(251,246,238,0.7); word-break:break-all; margin-bottom:8px; }
  .resultado .acoes{ display:flex; gap:8px; }
  .resultado .acoes button{ flex:1; padding:9px; font-size:12px; background:transparent; border:1px solid var(--amber); color:var(--amber); }
  .resultado .acoes button.copiado{ background:var(--amber); color:#241a08; }
  .rodape{ margin-top:18px; font-size:11px; color:rgba(251,246,238,0.35); text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Marca d'água</h1>
    <p class="sub">Insira o número do lead, depois arraste, cole (Ctrl+V) ou clique para adicionar foto ou vídeo.</p>

    <label for="numeroLead">Número do lead (WhatsApp)</label>
    <input type="text" id="numeroLead" inputmode="numeric" placeholder="Ex: 5582991463995">

    <div id="drop" tabindex="0">Solte, cole ou clique aqui (foto ou vídeo)</div>
    <input type="file" id="arquivo" multiple accept="image/*,video/*">
    <div id="status"></div>
    <div id="resultados"></div>
    <p class="rodape">Tudo acontece no seu navegador. Nada é enviado para fora.<br>Vídeos são regravados em tempo real: mantenha esta aba aberta e visível até terminar.</p>
  </div>

<script>
  // ======================= CONFIGURACOES =======================
  var COR_LINHA = '255,255,255';
  var OPACIDADE_LINHA = 55;        // 0 a 255
  var ESPESSURA_LINHA = 1;
  var ESPACAMENTO_LINHA = 26;
  var ANGULO_LINHA = 45;
  var LINHAS_CRUZADAS = true;
  var SUFIXO_LINHAS = '-linhas';
  var QUALIDADE_JPG = 0.95;
  var FPS_VIDEO = 30;
  var BITRATE_VIDEO = 8000000;     // 8 Mbps
  var BAIXAR_ORIGINAL = false;     // true = baixa o original automaticamente (abre janela de salvar)
  // ===============================================================

  var numeroInput = document.getElementById('numeroLead');
  var drop = document.getElementById('drop');
  var inputArquivo = document.getElementById('arquivo');
  var statusEl = document.getElementById('status');
  var resultadosEl = document.getElementById('resultados');
  var contadorPorNumero = {};
  var filaVideos = Promise.resolve();

  function numeroAtual(){ return numeroInput.value.trim(); }
  function numeroSanitizado(){ return numeroAtual().replace(/[^0-9a-zA-Z]/g, ''); }

  function avisarNumeroFaltando(){
    statusEl.textContent = 'Adicione o número do lead antes de colar/adicionar o arquivo.';
    statusEl.classList.add('erro');
    numeroInput.classList.add('erro');
    numeroInput.focus();
    setTimeout(function(){ numeroInput.classList.remove('erro'); }, 1600);
  }

  drop.addEventListener('click', function(){
    if (!numeroAtual()){ avisarNumeroFaltando(); return; }
    inputArquivo.click();
  });
  drop.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); drop.click(); }
  });
  ['dragenter','dragover'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); if (numeroAtual()) drop.classList.add('ativo'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('ativo'); });
  });
  drop.addEventListener('drop', function(e){
    if (!numeroAtual()){ avisarNumeroFaltando(); return; }
    receberArquivos(e.dataTransfer.files);
  });
  inputArquivo.addEventListener('change', function(e){
    receberArquivos(e.target.files);
    inputArquivo.value = '';
  });

  document.addEventListener('paste', function(e){
    var itens = (e.clipboardData || window.clipboardData).items;
    var arquivos = [];
    for (var i = 0; i < itens.length; i++){
      var t = itens[i].type;
      if (t.indexOf('image') !== -1 || t.indexOf('video') !== -1){
        var a = itens[i].getAsFile();
        if (a) arquivos.push(a);
      }
    }
    if (arquivos.length === 0) return;
    if (!numeroAtual()){ e.preventDefault(); avisarNumeroFaltando(); return; }
    receberArquivos(arquivos);
  });

  function receberArquivos(arquivos){
    var numero = numeroSanitizado();
    if (!numero){ avisarNumeroFaltando(); return; }
    Array.from(arquivos).forEach(function(arquivo){
      if (arquivo.type.startsWith('image/')) tratarNovaImagem(arquivo, numero);
      else if (arquivo.type.startsWith('video/')){
        // vídeos entram numa fila: um por vez
        var sufixo = proximoSufixoIndice(numero);
        if (BAIXAR_ORIGINAL) baixar(arquivo, numero + sufixo + '.' + extensaoDoArquivo(arquivo));
        filaVideos = filaVideos.then(function(){ return tratarNovoVideo(arquivo, numero, sufixo); });
      }
    });
  }

  function extensaoDoArquivo(arquivo){
    var mapa = { 'image/png':'png', 'image/webp':'webp', 'image/jpeg':'jpg', 'video/mp4':'mp4', 'video/webm':'webm', 'video/quicktime':'mov' };
    if (mapa[arquivo.type]) return mapa[arquivo.type];
    var partes = (arquivo.name || '').split('.');
    if (partes.length > 1) return partes.pop().toLowerCase();
    return arquivo.type.startsWith('video/') ? 'mp4' : 'jpg';
  }

  function proximoSufixoIndice(numero){
    contadorPorNumero[numero] = (contadorPorNumero[numero] || 0) + 1;
    var c = contadorPorNumero[numero];
    return c > 1 ? ('-' + c) : '';
  }

  // ---------------------- IMAGEM ----------------------
  async function tratarNovaImagem(arquivo, numero){
    var sufixo = proximoSufixoIndice(numero);
    if (BAIXAR_ORIGINAL) baixar(arquivo, numero + sufixo + '.' + extensaoDoArquivo(arquivo));
    statusEl.classList.remove('erro');
    statusEl.textContent = 'Gerando marca d\'água...';
    try{
      var blob = await processarImagem(arquivo);
      adicionarResultado(numero + sufixo + SUFIXO_LINHAS + '.jpg', blob, false);
      statusEl.textContent = 'Pronto! Versão com linhas disponível abaixo.';
    } catch(erro){
      statusEl.textContent = 'Erro ao gerar marca d\'água: ' + erro.message;
      statusEl.classList.add('erro');
    }
  }

  function desenharLinhas(ctx, w, h, anguloGraus){
    var diagonal = Math.sqrt(w*w + h*h) + 40;
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(anguloGraus * Math.PI / 180);
    ctx.beginPath();
    for (var y = -diagonal/2; y < diagonal/2; y += ESPACAMENTO_LINHA){
      ctx.moveTo(-diagonal/2, y);
      ctx.lineTo(diagonal/2, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function aplicarMarcaDagua(ctx, w, h){
    ctx.save();
    ctx.strokeStyle = 'rgba(' + COR_LINHA + ',' + (OPACIDADE_LINHA/255) + ')';
    ctx.lineWidth = ESPESSURA_LINHA;
    desenharLinhas(ctx, w, h, ANGULO_LINHA);
    if (LINHAS_CRUZADAS) desenharLinhas(ctx, w, h, ANGULO_LINHA + 90);
    ctx.restore();
  }

  function carregarImagem(arquivo){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(arquivo);
      img.onload = function(){ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function(erro){ URL.revokeObjectURL(url); reject(new Error('imagem inválida')); };
      img.src = url;
    });
  }

  function processarImagem(arquivo){
    return carregarImagem(arquivo).then(function(img){
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';                       // PNG transparente não vira preto
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      aplicarMarcaDagua(ctx, canvas.width, canvas.height);
      return new Promise(function(resolve){ canvas.toBlob(resolve, 'image/jpeg', QUALIDADE_JPG); });
    });
  }

  // ---------------------- VÍDEO ----------------------
  function escolherMime(){
    var opcoes = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    for (var i = 0; i < opcoes.length; i++){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(opcoes[i])) return opcoes[i];
    }
    return '';
  }

  async function tratarNovoVideo(arquivo, numero, sufixo){
    statusEl.classList.remove('erro');
    try{
      var r = await processarVideo(arquivo, function(p){
        statusEl.textContent = 'Gerando vídeo com marca d\'água... ' + Math.round(p * 100) + '% (mantenha a aba aberta)';
      });
      adicionarResultado(numero + sufixo + SUFIXO_LINHAS + '.' + r.ext, r.blob, true);
      statusEl.textContent = 'Pronto! Vídeo com linhas disponível abaixo.';
    } catch(erro){
      statusEl.textContent = 'Erro ao gerar vídeo: ' + erro.message;
      statusEl.classList.add('erro');
    }
  }

  function processarVideo(arquivo, onProgresso){
    return new Promise(async function(resolve, reject){
      if (!window.MediaRecorder){ reject(new Error('este navegador não suporta gravação de vídeo')); return; }
      var url = URL.createObjectURL(arquivo);
      var v = document.createElement('video');
      v.src = url; v.playsInline = true; v.preload = 'auto';
      var actx = null;
      function limpar(){ URL.revokeObjectURL(url); if (actx) actx.close().catch(function(){}); }

      try{
        await new Promise(function(res, rej){
          v.onloadedmetadata = res;
          v.onerror = function(){ rej(new Error('formato de vídeo não suportado pelo navegador')); };
        });
      } catch(e){ limpar(); reject(e); return; }

      var w = v.videoWidth, h = v.videoHeight;
      var canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');

      // linhas desenhadas uma única vez e reaproveitadas em todos os frames
      var overlay = document.createElement('canvas'); overlay.width = w; overlay.height = h;
      aplicarMarcaDagua(overlay.getContext('2d'), w, h);

      var stream = canvas.captureStream(FPS_VIDEO);
      try{
        actx = new (window.AudioContext || window.webkitAudioContext)();
        await actx.resume();
        var fonte = actx.createMediaElementSource(v);
        var destino = actx.createMediaStreamDestination();
        fonte.connect(destino);                       // não conecta nas caixas de som: grava em silêncio
        destino.stream.getAudioTracks().forEach(function(t){ stream.addTrack(t); });
      } catch(e){ /* segue sem áudio */ }

      var mime = escolherMime();
      var opcoes = { videoBitsPerSecond: BITRATE_VIDEO };
      if (mime) opcoes.mimeType = mime;
      var rec;
      try{ rec = new MediaRecorder(stream, opcoes); }
      catch(e){ limpar(); reject(new Error('não foi possível iniciar a gravação')); return; }

      var pedacos = [];
      rec.ondataavailable = function(e){ if (e.data && e.data.size) pedacos.push(e.data); };
      rec.onstop = function(){
        var tipo = rec.mimeType || mime || 'video/webm';
        limpar();
        resolve({ blob: new Blob(pedacos, { type: tipo }), ext: tipo.indexOf('mp4') !== -1 ? 'mp4' : 'webm' });
      };
      rec.onerror = function(){ limpar(); reject(new Error('falha durante a gravação')); };

      var rodando = true;
      function quadro(){
        if (!rodando) return;
        ctx.drawImage(v, 0, 0, w, h);
        ctx.drawImage(overlay, 0, 0);
        if (v.duration) onProgresso(Math.min(v.currentTime / v.duration, 1));
        requestAnimationFrame(quadro);
      }
      v.onended = function(){
        ctx.drawImage(v, 0, 0, w, h); ctx.drawImage(overlay, 0, 0);
        rodando = false;
        setTimeout(function(){ rec.stop(); }, 150);
      };

      rec.start(500);
      try{ await v.play(); }
      catch(e){ rodando = false; rec.stop(); limpar(); reject(new Error('o navegador bloqueou a reprodução do vídeo')); return; }
      quadro();
    });
  }

  // ---------------------- COMUM ----------------------
  async function copiarParaClipboard(blob, botao){
    try{
      var bitmap = await createImageBitmap(blob);
      var canvas = document.createElement('canvas');
      canvas.width = bitmap.width; canvas.height = bitmap.height;
      canvas.getContext('2d').drawImage(bitmap, 0, 0);
      var png = await new Promise(function(r){ canvas.toBlob(r, 'image/png'); });
      await navigator.clipboard.write([ new ClipboardItem({ 'image/png': png }) ]);
      var txt = botao.textContent;
      botao.textContent = 'Copiado ✓';
      botao.classList.add('copiado');
      setTimeout(function(){ botao.textContent = txt; botao.classList.remove('copiado'); }, 1500);
    } catch(erro){
      alert('Não foi possível copiar: ' + erro.message);
    }
  }

  async function copiarVideo(blob, botao){
    try{
      await navigator.clipboard.write([ new ClipboardItem({ [blob.type]: blob }) ]);
      var txt = botao.textContent;
      botao.textContent = 'Copiado ✓';
      botao.classList.add('copiado');
      setTimeout(function(){ botao.textContent = txt; botao.classList.remove('copiado'); }, 1500);
    } catch(erro){
      statusEl.classList.add('erro');
      statusEl.textContent = 'O navegador não permite copiar vídeo para a área de transferência. Arraste a miniatura do vídeo para a outra aba/conversa.';
    }
  }

  function baixar(blob, nome){
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url; link.download = nome;
    document.body.appendChild(link);
    link.click(); link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  function adicionarResultado(nome, blob, ehVideo){
    var linha = document.createElement('div');
    linha.className = 'resultado';

    var midia;
    if (ehVideo){
      midia = document.createElement('video');
      midia.src = URL.createObjectURL(blob);
      midia.muted = true; midia.controls = false; midia.preload = 'metadata';
    } else {
      midia = document.createElement('img');
      midia.src = URL.createObjectURL(blob);
    }

    var info = document.createElement('div'); info.className = 'info';
    var nomeEl = document.createElement('div'); nomeEl.className = 'nome'; nomeEl.textContent = nome;
    var acoes = document.createElement('div'); acoes.className = 'acoes';

    if (ehVideo){
      var btnCopiarVideo = document.createElement('button');
      btnCopiarVideo.textContent = 'Copiar';
      btnCopiarVideo.addEventListener('click', function(){ copiarVideo(blob, btnCopiarVideo); });
      acoes.appendChild(btnCopiarVideo);
      // permite arrastar a miniatura direto para outra aba/conversa
      midia.draggable = true;
      midia.title = 'Arraste para outra aba para anexar o vídeo';
      midia.addEventListener('dragstart', function(e){
        e.dataTransfer.effectAllowed = 'copy';
        try{ e.dataTransfer.items.add(new File([blob], nome, { type: blob.type })); }catch(_){}
        try{ e.dataTransfer.setData('DownloadURL', blob.type + ':' + nome + ':' + midia.src); }catch(_){}
      });
    } else {
      var btnCopiar = document.createElement('button');
      btnCopiar.textContent = 'Copiar';
      btnCopiar.addEventListener('click', function(){ copiarParaClipboard(blob, btnCopiar); });
      acoes.appendChild(btnCopiar);
    }
    var btnBaixar = document.createElement('button');
    btnBaixar.textContent = 'Baixar';
    btnBaixar.addEventListener('click', function(){ baixar(blob, nome); });
    acoes.appendChild(btnBaixar);

    info.appendChild(nomeEl); info.appendChild(acoes);
    linha.appendChild(midia); linha.appendChild(info);
    resultadosEl.prepend(linha);
  }
</script>
</body>
</html>
